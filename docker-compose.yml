services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teams_discovery_observer
      POSTGRES_USER: teams_observer
      POSTGRES_PASSWORD: teams_observer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teams_observer -d teams_discovery_observer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
